name: TotemNull
version: 1.0.0
main: com.example.totemnull.TotemNull
api-version: '26.1'
depend: [Citizens]
description: Totem of NULL - hit a player, blow the Call horn, NULL hunts them down.
commands:
  totemnull:
    description: Give yourself (or someone) the Totem of NULL
    usage: /totemnull [player]
    permission: totemnull.give
permissions:
  totemnull.give:
    description: Allows /totemnull
    default: op
