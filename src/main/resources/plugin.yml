name: TotemNull
version: 1.0.0
main: com.example.totemnull.TotemNull
api-version: '26.1'
depend: [Citizens]
description: Totem of NULL - command the NULL army with the Call horn or /nullcall.
commands:
  totemnull:
    description: Give yourself (or someone) the Totem of NULL
    usage: /totemnull [player]
    permission: totemnull.give
  nullcall:
    description: Summon or dismiss the NULL army (works on Java and Bedrock)
    usage: /nullcall
    aliases: [nullarmy]
    permission: totemnull.use
  nullform:
    description: Change the NULL formation
    usage: /nullform <ring|charge|scatter>
    aliases: [nullformation]
    permission: totemnull.use
  nullhunt:
    description: Turn NULL hunt mode on or off
    usage: /nullhunt
    permission: totemnull.use
  nullally:
    description: Manage the players NULL will never attack
    usage: /nullally <add|remove|list> [player]
    permission: totemnull.use
  nulltarget:
    description: Send NULL through a portal to kill a player, however far away
    usage: /nulltarget <player|cancel>
    permission: totemnull.use
permissions:
  totemnull.give:
    description: Allows /totemnull
    default: op
  totemnull.use:
    description: Allows /nullcall, /nullform, /nullhunt, /nullally and /nulltarget
    default: true
